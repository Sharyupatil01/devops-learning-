name : Events Demo 1 

on : 
   pull_request: 
    types:
      - opened 
   workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name : Output event data 
        run: echo "{{ toJSON(github.event) }}"
      - name : get code 
        uses: actions/checkout@v5
      - name : Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name : Install dependencies
        run: npm install
      - name : test
        run: npm run test
      - name : build
        run: npm run build
      - name : deploy
        run: echo "Deploying"
